[package]
name = "landil-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.7", features = ["cors", "compression-gzip"] }
sha2 = "0.11.2"
scrypt = { version = "0.12.0", default-features = false }
unicode-normalization = "0.1.26"
rand = "0.10.4"
hex = "0.4.3"
subtle = "2.6.1"

[profile.release]
strip = true
lto = true

# scrypt is ~20x slower unoptimized: keep local sign-in fast in debug builds.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
